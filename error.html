<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oops! - Bloom & Grow</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fff5f5; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .error-card { text-align: center; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: white; }
        .icon { font-size: 50px; color: #dc3545; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 error-card">
                <div class="icon">⚠️</div>
                <h1 class="display-5 fw-bold text-danger">Something Went Wrong</h1>
                <p class="lead mb-4">We couldn't process your sign-up right now. This is usually a temporary connection issue.</p>
                <a href="/" class="btn  btn-lg px-5 rounded-pill" style="background-color:#54d1b2;">Try Again</a>
            </div>
        </div>
    </div>
</body>
</html>
